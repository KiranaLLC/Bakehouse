# Cloudflare Worker that handles address checks and Stripe payments for
# kiranabakehouse.com. Deploy with: npx wrangler deploy  (see README.md)

name = "kirana-checkout"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Where customers are sent back to after paying or cancelling.
SITE_URL = "https://www.kiranabakehouse.com"
# Websites allowed to call this worker, comma-separated.
ALLOWED_ORIGINS = "https://www.kiranabakehouse.com,https://kiranabakehouse.com,http://localhost:8000"
# Who emails come from (an address on the domain verified in Resend).
EMAIL_FROM = "Kirana Bakehouse <hello@kiranabakehouse.com>"

# STRIPE_SECRET_KEY is a secret, not a var. Set it with:
#   npx wrangler secret put STRIPE_SECRET_KEY
# For local testing, put it in worker/.dev.vars instead (never committed).
#
# Emails (README, "Emails") are turned on by two more secrets:
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET

# Every hour: "a new drop is open" and "pickup tomorrow" emails.
[triggers]
crons = ["0 * * * *"]

# Pickup drops database (see README, "Pickup drops"). Create it once with
#   npx wrangler d1 create kirana-pickup
# then paste the database_id it prints below, remove the # signs, and apply
#   npx wrangler d1 execute kirana-pickup --remote --file=schema.sql
# Until then pickup shows no drops and delivery works as normal.
[[d1_databases]]
binding = "DB"
database_name = "kirana-pickup"
database_id = "941c0f05-e9f3-4a94-9453-75e17352491f"
